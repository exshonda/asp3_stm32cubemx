#  STM32N6570-DK 用 OpenOCD 最小設定（Windows / OpenOCD 0.12.0）
#
#  ★ -ap-num 1 が必須。STM32_Programmer_CLI は "Access Port Number : 3" と
#     表示するが，Cortex-M55 コアが見えるのは AP1。AP0/2/3/4 では
#     "Cortex-M PARTNO 0x0 is unrecognized" で examine に失敗する。
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 2000
set _CHIPNAME stm32n6
swd newdap $_CHIPNAME cpu -expected-id 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap -ap-num 1
